[workspace]
resolver = "2"
members = ["crates/unship-core", "crates/unship-cli", "apps/desktop/src-tauri"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
tempfile = "3.0"
glob = "0.3"
