name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --exclude untask-desktop --all-targets -- -D warnings

      - run: cargo test --workspace --exclude untask-desktop

  desktop:
    name: Desktop build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - run: npm ci
        working-directory: apps/desktop

      - run: npm run check
        working-directory: apps/desktop

      - run: cargo clippy -p untask-desktop --all-targets -- -D warnings

      - run: cargo test -p untask-desktop

      - run: npm run tauri build
        working-directory: apps/desktop
