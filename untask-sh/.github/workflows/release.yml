name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  cli:
    name: CLI (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} -p untask

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../untask-${{ github.ref_name }}-${{ matrix.target }}.tar.gz untask
          cd ../../..

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/untask.exe" -DestinationPath "untask-${{ env.TAG }}-${{ matrix.target }}.zip"
        env:
          TAG: ${{ github.ref_name }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: untask-${{ github.ref_name }}-${{ matrix.target }}.*

  desktop-preview:
    name: Desktop preview (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - run: npm ci
        working-directory: apps/desktop

      - name: Build unsigned desktop app
        run: npm run tauri build
        working-directory: apps/desktop

      - name: Rename .dmg as preview
        run: |
          DMG=$(find apps/desktop/src-tauri/target/release/bundle/dmg -name '*.dmg' | head -1)
          BASENAME=$(basename "$DMG" .dmg)
          cp "$DMG" "${BASENAME}-PREVIEW-UNSIGNED.dmg"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: "*-PREVIEW-UNSIGNED.dmg"
          body: |
            ## Desktop Preview

            The macOS `.dmg` is an **unsigned preview build**. You may need to right-click and select "Open" to bypass Gatekeeper.

            Signed builds will be available once code-signing credentials are configured.
