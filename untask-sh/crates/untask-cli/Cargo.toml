[package]
name = "untask"
version = "0.1.0"
edition = "2024"

[dependencies]
untask-core = { path = "../untask-core" }
clap = { version = "4.5", features = ["derive"] }
atty = "0.2"
colored = "2.0"
dirs = "6.0"
serde = { workspace = true }
serde_json = { workspace = true }
shlex = "1.3"

[dev-dependencies]
insta = { version = "1.42", features = ["json", "redactions"] }
tempfile = { workspace = true }
serde_json = { workspace = true }
