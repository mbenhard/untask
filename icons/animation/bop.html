<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flusk Bop — Pick a vibe</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #161616;
      font-family: 'JetBrains Mono', monospace;
      color: #555;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
      max-width: 960px;
      width: 100%;
    }

    .cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 40px 20px 32px;
      border: 1px solid #1e1e1e;
      min-height: 300px;
      position: relative;
    }

    .label {
      position: absolute;
      top: 14px;
      left: 14px;
      font-size: 10px;
      letter-spacing: 0.08em;
      color: #3a3a3a;
      text-transform: uppercase;
    }

    .label span {
      color: #555;
      font-weight: 500;
    }

    /* ---- Shared ---- */
    .character {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .body {
      width: 95px;
      position: relative;
      z-index: 2;
      transform-origin: center bottom;
      margin-bottom: -10px;
    }

    .body svg, .feet svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .feet {
      width: 32px;
      position: relative;
      z-index: 1;
    }

    .shadow {
      width: 36px;
      height: 7px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.3) 0%, transparent 70%);
      border-radius: 50%;
      margin-top: 3px;
    }

    /* =============================================
       1. GENTLE FLOAT — 0.55s, fast dreamy hover
       ============================================= */
    .v1 .body  { animation: v1 0.55s ease-in-out infinite; }
    .v1 .shadow { animation: v1s 0.55s ease-in-out infinite; }

    @keyframes v1 {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    @keyframes v1s {
      0%, 100% { transform: scaleX(1); opacity: 0.4; }
      50%      { transform: scaleX(1.15); opacity: 0.2; }
    }

    /* =============================================
       2. BOUNCY + PAUSE — 2.4s, bob then rest
       ============================================= */
    .v2 .body  { animation: v2 2.4s ease-in-out infinite; }
    .v2 .shadow { animation: v2s 2.4s ease-in-out infinite; }

    @keyframes v2 {
      0%   { transform: translateY(0) scaleX(1) scaleY(1); }
      8%   { transform: translateY(2px) scaleX(1.04) scaleY(0.96); }
      22%  { transform: translateY(-10px) scaleX(0.96) scaleY(1.04); }
      34%  { transform: translateY(1px) scaleX(1.03) scaleY(0.97); }
      42%  { transform: translateY(0) scaleX(1) scaleY(1); }
      100% { transform: translateY(0) scaleX(1) scaleY(1); }
    }
    @keyframes v2s {
      0%   { transform: scaleX(1); opacity: 0.4; }
      8%   { transform: scaleX(0.85); opacity: 0.55; }
      22%  { transform: scaleX(1.35); opacity: 0.12; }
      34%  { transform: scaleX(0.85); opacity: 0.55; }
      42%  { transform: scaleX(1); opacity: 0.4; }
      100% { transform: scaleX(1); opacity: 0.4; }
    }

    /* =============================================
       3. PEPPY WOBBLE — 1.2s, tilt + bob
       ============================================= */
    .v3 .body  { animation: v3 1.2s ease-in-out infinite; }
    .v3 .shadow { animation: v3s 1.2s ease-in-out infinite; }

    @keyframes v3 {
      0%   { transform: translateY(0) rotate(0deg); }
      25%  { transform: translateY(-9px) rotate(2.5deg); }
      50%  { transform: translateY(0) rotate(0deg); }
      75%  { transform: translateY(-9px) rotate(-2.5deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }
    @keyframes v3s {
      0%   { transform: scaleX(1) translateX(0); opacity: 0.35; }
      25%  { transform: scaleX(1.15) translateX(1px); opacity: 0.18; }
      50%  { transform: scaleX(1) translateX(0); opacity: 0.35; }
      75%  { transform: scaleX(1.15) translateX(-1px); opacity: 0.18; }
      100% { transform: scaleX(1) translateX(0); opacity: 0.35; }
    }

    /* =============================================
       4. DOUBLE TAP — 1.4s, two hops + rest
       ============================================= */
    .v4 .body  { animation: v4 1.4s ease-out infinite; }
    .v4 .shadow { animation: v4s 1.4s ease-out infinite; }

    @keyframes v4 {
      0%   { transform: translateY(0) scaleX(1) scaleY(1); }
      12%  { transform: translateY(-10px) scaleX(0.96) scaleY(1.04); }
      24%  { transform: translateY(1px) scaleX(1.03) scaleY(0.97); }
      36%  { transform: translateY(-7px) scaleX(0.97) scaleY(1.03); }
      48%  { transform: translateY(0) scaleX(1) scaleY(1); }
      100% { transform: translateY(0) scaleX(1) scaleY(1); }
    }
    @keyframes v4s {
      0%   { transform: scaleX(1); opacity: 0.35; }
      12%  { transform: scaleX(1.3); opacity: 0.12; }
      24%  { transform: scaleX(0.85); opacity: 0.5; }
      36%  { transform: scaleX(1.2); opacity: 0.18; }
      48%  { transform: scaleX(1); opacity: 0.35; }
      100% { transform: scaleX(1); opacity: 0.35; }
    }

    /* =============================================
       5. ELASTIC SNAP — 1s, fast up + spring settle
       ============================================= */
    .v5 .body  { animation: v5 1s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .v5 .shadow { animation: v5s 1s cubic-bezier(0.22, 1, 0.36, 1) infinite; }

    @keyframes v5 {
      0%   { transform: translateY(0) scaleX(1) scaleY(1); }
      8%   { transform: translateY(2px) scaleX(1.06) scaleY(0.94); }
      30%  { transform: translateY(-14px) scaleX(0.94) scaleY(1.06); }
      52%  { transform: translateY(2px) scaleX(1.04) scaleY(0.96); }
      68%  { transform: translateY(-3px) scaleX(0.98) scaleY(1.02); }
      82%  { transform: translateY(0.5px) scaleX(1.01) scaleY(0.99); }
      100% { transform: translateY(0) scaleX(1) scaleY(1); }
    }
    @keyframes v5s {
      0%   { transform: scaleX(1); opacity: 0.35; }
      8%   { transform: scaleX(0.8); opacity: 0.55; }
      30%  { transform: scaleX(1.5); opacity: 0.08; }
      52%  { transform: scaleX(0.85); opacity: 0.5; }
      68%  { transform: scaleX(1.1); opacity: 0.25; }
      82%  { transform: scaleX(0.95); opacity: 0.38; }
      100% { transform: scaleX(1); opacity: 0.35; }
    }

    /* =============================================
       6. SMOOTH BOP — 1.4s, classic smooth
       ============================================= */
    .v6 .body  { animation: v6 1.4s ease-in-out infinite; }
    .v6 .shadow { animation: v6s 1.4s ease-in-out infinite; }

    @keyframes v6 {
      0%   { transform: translateY(0) scaleX(1) scaleY(1); }
      35%  { transform: translateY(-9px) scaleX(0.97) scaleY(1.03); }
      50%  { transform: translateY(-9px) scaleX(0.97) scaleY(1.03); }
      80%  { transform: translateY(1px) scaleX(1.02) scaleY(0.98); }
      100% { transform: translateY(0) scaleX(1) scaleY(1); }
    }
    @keyframes v6s {
      0%   { transform: scaleX(1); opacity: 0.35; }
      35%  { transform: scaleX(1.2); opacity: 0.18; }
      50%  { transform: scaleX(1.2); opacity: 0.18; }
      80%  { transform: scaleX(0.9); opacity: 0.5; }
      100% { transform: scaleX(1); opacity: 0.35; }
    }
  </style>
</head>
<body>
  <div class="grid" id="grid"></div>

  <template id="character-template">
    <div class="character">
      <div class="body">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 122.89 166.04">
          <path fill="#303030" d="M120.39,36.58c1.07-.22,1.56-.39,2.49-1.01-15.26-5.36-30.9-9.88-46.49-14.2C75.08,3.55,51.53-5.85,37.12,3.96c-13.89,9.55-12.2,28.04-16.23,42.7-5.67,28.52-11.32,57.04-17,85.55-3.1,15.47-11.57,36.65,13.69,33.52,16.92-.48,33.84-1.07,50.75-1.85,22.47-.89,39.64,3.24,30.44-26.67-6.31-30.86-12.58-61.72-18.81-92.6,13.56-2.23,26.95-5.41,40.44-8.03ZM59.02,23.22c-.01,9.92-15.48,8.5-13.45-1.25,1.54-7.53,13.49-6.61,13.45,1.25Z"/>
        </svg>
      </div>
      <div class="feet">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40.72 50.38">
          <path fill="#303030" d="M1.94,47.87c.23-.13.45-.26.69-.4.41-.22.83-.44,1.25-.65,0-.23,0-.46,0-.7.03-5.6.07-11.19.11-16.79.02-2.71.04-5.41.05-8.12.01-2.36.03-4.72.05-7.08,0-1.25.02-2.5.02-3.75,0-1.18.01-2.35.02-3.53,0-.64,0-1.27.01-1.91,0-.38,0-.76,0-1.15,0-.33,0-.66,0-1q.02-.94.37-2.15c1.17,0,2.34,0,3.55,0,.26,5.66.39,11.31.42,16.98,0,.82.01,1.64.02,2.46.02,1.91.03,3.83.04,5.74.02,2.19.03,4.37.05,6.56.04,4.48.07,8.97.1,13.45,1.37-.27,2.73-.56,4.1-.85.39-.08.77-.15,1.17-.23q3.2-.7,4.14-1.86c.2-.31.4-.62.6-.94q1.22-.75,2.58-.97c0-.37,0-.74,0-1.13,0-3.55-.01-7.1-.01-10.65,0-1.82,0-3.65,0-5.47q-.04-9.78.17-19.55.02-.55.04-1.1,0-1.6.47-3.09,1.64-.04,3.23.32c.4.8.36,1.32.36,2.21,0,.33,0,.66,0,1,0,.36,0,.73,0,1.1,0,.38,0,.76,0,1.15,0,1.05,0,2.09,0,3.14,0,1.09,0,2.19,0,3.28,0,2.07,0,4.14,0,6.21,0,2.36,0,4.71,0,7.07,0,4.85,0,9.7-.02,14.55.28-.07.55-.14.83-.22,1.02-.27,2.05-.53,3.08-.78.44-.11.89-.23,1.33-.34.64-.17,1.28-.33,1.92-.49.38-.1.77-.2,1.16-.3,1.14-.15,1.66-.05,2.66.51q.59.81.97,1.61c-1.59.57-3.19.95-4.84,1.29q.56.02,1.13.04c.5.02.99.04,1.49.06.25,0,.49.01.74.02,1.57.07,2.7.3,4.06,1.17q.74.91.65,1.94-10.55.16-21.31.32c.21.43.43.85.65,1.29-1.18.41-2.32.75-3.55.97.96.32,1.7.39,2.7.44,1.37.12,2.37.22,3.43,1.17.21.53.43,1.07.65,1.61-7.67,0-15.34,0-23.24,0q.63-1.66,1.94-2.5Z"/>
        </svg>
      </div>
      <div class="shadow"></div>
    </div>
  </template>

  <script>
    const variants = [
      { id: 'v1', label: '1', name: 'gentle float', speed: '0.55s' },
      { id: 'v2', label: '2', name: 'bouncy + pause', speed: '2.4s' },
      { id: 'v3', label: '3', name: 'peppy wobble', speed: '1.2s' },
      { id: 'v4', label: '4', name: 'double tap', speed: '1.4s' },
      { id: 'v5', label: '5', name: 'elastic snap', speed: '1.0s' },
      { id: 'v6', label: '6', name: 'smooth bop', speed: '1.4s' },
    ];

    const grid = document.getElementById('grid');
    const tpl = document.getElementById('character-template');

    variants.forEach(v => {
      const cell = document.createElement('div');
      cell.className = `cell ${v.id}`;
      cell.innerHTML = `<div class="label"><span>${v.label}</span> ${v.name} <span style="color:#333;margin-left:4px">${v.speed}</span></div>`;
      cell.appendChild(tpl.content.cloneNode(true));
      grid.appendChild(cell);
    });
  </script>
</body>
</html>
