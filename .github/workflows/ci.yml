name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck & Test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        # Skip postinstall to avoid patch-electron-dev.sh (dev-only macOS plist patch)
        run: pnpm install --ignore-scripts
        working-directory: flusk

      - name: Rebuild native modules for Electron
        # better-sqlite3 must be compiled against the Electron ABI
        run: pnpm rebuild:electron
        working-directory: flusk

      - name: Typecheck
        run: pnpm typecheck
        working-directory: flusk

      - name: Test
        run: pnpm test
        working-directory: flusk
