name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release macOS
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        # Skip postinstall to avoid patch-electron-dev.sh (dev-only macOS plist patch)
        run: pnpm install --ignore-scripts
        working-directory: flusk

      - name: Rebuild native modules for Electron
        # better-sqlite3 must be compiled against the Electron ABI before packaging
        run: pnpm rebuild:electron
        working-directory: flusk

      - name: Typecheck
        run: pnpm typecheck
        working-directory: flusk

      - name: Test
        run: pnpm test
        working-directory: flusk

      - name: Build & package
        # electron-forge make bundles the app and creates the macOS ZIP artifact
        run: pnpm make
        working-directory: flusk

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: flusk/out/make/zip/darwin/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
